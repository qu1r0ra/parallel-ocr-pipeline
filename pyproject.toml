[project]
name = "parallel-ocr-pipeline"
version = "0.1.0"
description = "Course scaffold and collaboration contract for a Windows OCR pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "Pillow>=11.3.0",
    "pytesseract>=0.3.13",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.basedpyright]
include = ["src", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
