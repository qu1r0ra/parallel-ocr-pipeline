[project]
name = "parallel-ocr-pipeline"
version = "0.1.0"
description = "Distributed OCR pipeline for CSC611M MP2"
requires-python = ">=3.15,<3.16"
dependencies = [
    "Pillow>=11.3.0",
    "pyro5>=5.15,<6",
    "pytesseract>=0.3.13",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.basedpyright]
include = ["src", "scripts", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
